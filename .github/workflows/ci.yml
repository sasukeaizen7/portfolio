# Plan day 83: CI/CD with GitHub Actions. Every push and pull request runs the checks of every project.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:                       # a new push cancels the previous run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_DSN: postgresql://de:de@localhost:5435/de

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.0
      - run: ruff check .

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [01-python-etl, 02-data-modeling, 03-project-1-ingestion, 05-airflow-stock-pipeline,
                  07-project-2-orchestrated, 08-data-lake, 09-kafka-streaming, 11-final-project]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: de
          POSTGRES_PASSWORD: de
          POSTGRES_DB: de
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U de -d de" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: ${{ matrix.project }}
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt pytest; fi
          # 02's tests use psycopg and pytest only
          pip install "psycopg[binary]==3.2.10" pytest==8.4.2
      - name: Test
        working-directory: ${{ matrix.project }}
        run: pytest -q

  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyspark==4.2.0 delta-spark==4.4.0 pyarrow==21.0.0 pandas==2.3.3 pytest==8.4.2
      - name: 06 PySpark transformations
        working-directory: 06-pyspark
        run: PYTHONPATH=. pytest -q
      - name: 07 Spark job transformations
        working-directory: 07-project-2-orchestrated
        run: pytest -q tests/test_campaign_transforms.py
      - name: 10 Delta medallion (bronze, silver, gold)
        working-directory: 10-medallion-delta
        run: PYTHONPATH=. pytest -q

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: de
          POSTGRES_PASSWORD: de
          POSTGRES_DB: de
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U de -d de" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r 04-dbt-analytics/requirements.txt -r 03-project-1-ingestion/requirements.txt boto3==1.43.108
      - name: Create Project 1's (empty) warehouse, the source of the dbt project
        working-directory: 03-project-1-ingestion
        run: python -m ingest.pipeline setup
      - name: dbt build (models, seeds, snapshot, data tests and unit tests on the empty warehouse)
        working-directory: 04-dbt-analytics
        run: |
          dbt deps --profiles-dir .
          dbt build --profiles-dir .
      - name: Create the (empty) raw tables of projects 07 and 11
        run: |
          python - <<'PY'
          import sys, psycopg
          sys.path[:0] = ["11-final-project/include", "07-project-2-orchestrated/include"]
          from velib import monitoring, warehouse
          import marketing
          with psycopg.connect("postgresql://de:de@localhost:5435/de") as c:
              warehouse.ensure_schema(c)
              monitoring.ensure_schema(c)
              for statement in marketing.DDL.split(";"):
                  if statement.strip():
                      c.execute(statement)
          PY
      - name: dbt build, project 07 (marketing)
        working-directory: 07-project-2-orchestrated/dbt
        env: {PG_DB: de}
        run: dbt deps --profiles-dir . && dbt build --profiles-dir .
      - name: dbt build, project 11 (Vélib')
        working-directory: 11-final-project/dbt
        env: {PG_DB: de}
        run: dbt deps --profiles-dir . && dbt build --profiles-dir .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Final project's Terraform (reuses the module above)
        working-directory: 11-final-project/infra
        run: terraform fmt -check && terraform init -backend=false && terraform validate

  compose-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every docker-compose.yml is valid
        run: |
          for f in */docker-compose.yml; do echo "$f"; docker compose -f "$f" config -q; done

# Kept in the project (not ~/.dbt) so `dbt --profiles-dir .` works anywhere; secrets come from env vars.
shop_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', '5435') | int }}"
      user: "{{ env_var('PG_USER', 'de') }}"
      password: "{{ env_var('PG_PASSWORD', 'de') }}"
      dbname: "{{ env_var('PG_DB', 'de') }}"
      schema: analytics
      threads: 4

# A local "AWS data lake": SeaweedFS = S3 (with per-user, per-bucket permissions); the lake image plays
# the Lambda / Glue job / Glue crawler / Athena roles.
#   docker compose up -d s3 && docker compose run --rm lake python -m lake.setup_buckets
#   docker compose run --rm lake python -m lake.ingest_raw          # 12 months of Citi Bike Jersey City
#   docker compose run --rm lake python -m lake.raw_to_clean
#   docker compose run --rm lake python -m lake.crawler
#   docker compose run --rm lake python -m lake.query
#   docker compose run --rm lake python -m lake.check_permissions
x-lake-env: &lake-env
  S3_ENDPOINT: http://s3:8333
  AWS_ACCESS_KEY_ID: pipeline                     # least-privilege pipeline identity, not the admin
  AWS_SECRET_ACCESS_KEY: pipeline-secret-123
  ANALYST_ACCESS_KEY: analyst
  ANALYST_SECRET_KEY: analyst-secret-123
  ADMIN_ACCESS_KEY: admin
  ADMIN_SECRET_KEY: admin-secret-123

services:
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
      - ./docker/s3.json:/etc/seaweedfs/s3.json:ro

  lake:
    build: .
    environment: *lake-env
    volumes:
      - ./results:/app/results
    depends_on: [s3]

volumes:
  s3-data:

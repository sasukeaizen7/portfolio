# The final project: Vélib' API -> Airflow -> S3 (SeaweedFS) -> warehouse (Postgres) -> dbt -> dashboard.
#   docker compose up -d --build
#   Airflow:   http://localhost:8080   (DAGs velib_ingest, velib_transform, velib_monitoring)
#   Dashboard: http://localhost:8501
#   Optional: snapshots collected earlier with scripts/collect_snapshots.py ->
#     docker compose run --rm airflow-scheduler python -m velib.lake upload-landing /opt/airflow/data/landing
x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: de100-portfolio-dev-only-jwt-secret-change-me
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW_CONN_WAREHOUSE: postgresql://de:de@postgres:5432/warehouse
    PYTHONPATH: /opt/airflow/include:/opt/airflow/dags
    S3_ENDPOINT: http://s3:8333
    AWS_ACCESS_KEY_ID: pipeline
    AWS_SECRET_ACCESS_KEY: pipeline-secret-123
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}        # optional: a Slack/Teams/Discord incoming webhook
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    s3:
      condition: service_started

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-warehouse.sql:/docker-entrypoint-initdb.d/create-warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
      - ./docker/s3.json:/etc/seaweedfs/s3.json:ro

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    build: ./dashboard
    environment:
      # After `terraform apply` in infra/, point this at the read-only role: DASHBOARD_DSN=postgresql://velib_dashboard:...
      WAREHOUSE_DSN: ${DASHBOARD_DSN:-postgresql://de:de@postgres:5432/warehouse}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  s3-data:
  airflow-logs:
